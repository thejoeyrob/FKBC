<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FKBC Fight Arcade">
  <title>FKBC Fight Arcade</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="menuView" class="view active" aria-label="FKBC Fight Arcade menu">
      <div class="menuBackdrop"></div>
      <div class="menuContent">
        <div class="brand">FKBC <span>FIGHT ARCADE</span></div>
        <p class="tagline">TRAIN • FIGHT • LEVEL UP</p>
        <div class="menuPanel">
          <h1>Choose your fighter</h1>
          <p>Arcade ladder: Gracie → Jack → John → Justin → Joe → Paul</p>
          <div id="fighterGrid" class="fighterGrid"></div>
          <div class="menuActions">
            <button id="startArcade" class="primary" type="button">START ARCADE</button>
            <button id="startTraining" type="button">TRAINING</button>
            <button id="showMoves" type="button">MOVE LIST</button>
            <button id="showScores" type="button">HIGH SCORES</button>
          </div>
        </div>
      </div>
    </section>

    <section id="gameView" class="view" aria-label="Fight game">
      <div id="stageFrame">
        <canvas id="gameCanvas" width="1280" height="720" aria-label="FKBC Fight Arcade playfield"></canvas>
        <div id="touchControls" aria-label="Touch controls">
          <div class="dpad" aria-label="Directional pad">
            <button class="dir up" data-dir="up" aria-label="Up">▲</button>
            <button class="dir left" data-dir="left" aria-label="Left">◀</button>
            <div class="padCenter"></div>
            <button class="dir right" data-dir="right" aria-label="Right">▶</button>
            <button class="dir down" data-dir="down" aria-label="Down">▼</button>
          </div>
          <div class="attackPad" aria-label="Attack buttons">
            <button class="atk lp" data-atk="LP"><b>LP</b><small>Light Punch</small></button>
            <button class="atk mp" data-atk="MP"><b>MP</b><small>Medium Punch</small></button>
            <button class="atk hp" data-atk="HP"><b>HP</b><small>Heavy Punch</small></button>
            <button class="atk lk" data-atk="LK"><b>LK</b><small>Light Kick</small></button>
            <button class="atk mk" data-atk="MK"><b>MK</b><small>Medium Kick</small></button>
            <button class="atk hk" data-atk="HK"><b>HK</b><small>Heavy Kick</small></button>
          </div>
          <button id="pauseBtn" class="pauseBtn" type="button" aria-label="Pause">Ⅱ</button>
        </div>
        <div id="rotateHint"><div>↻</div><strong>Rotate to landscape</strong><span>Fight mode is designed for a full 16:9 screen.</span></div>
      </div>
    </section>

    <dialog id="panelDialog">
      <form method="dialog" class="dialogBox">
        <button class="closeDialog" value="close" aria-label="Close">×</button>
        <div id="dialogContent"></div>
      </form>
    </dialog>

    <dialog id="nameDialog">
      <form id="scoreForm" class="dialogBox scoreBox">
        <h2>NEW HIGH SCORE</h2>
        <div id="finalScore" class="bigScore">0</div>
        <label for="playerName">Enter your name</label>
        <input id="playerName" maxlength="12" autocomplete="nickname" placeholder="PLAYER" required>
        <button class="primary" type="submit">SAVE SCORE</button>
      </form>
    </dialog>
  </main>
  <script src="app.js"></script>
</body>
</html>
